# ============================================================================
# ir_collect.conf — example configuration for ir_collect.sh v3.0
# ----------------------------------------------------------------------------
# This file is SOURCED AS ZSH by the collector. It may set any variable, array,
# or associative array used by the script.
#
# Precedence:  built-in defaults  <  THIS FILE  <  environment  <  CLI flags
#
# Location resolution (first match wins):
#   1. --config FILE on the CLI
#   2. $IR_CONFIG environment variable
#   3. <evidence-base>/ir_collect.conf   (default)
#
# Every line below shows the BUILT-IN DEFAULT. Uncomment + edit to override.
# ============================================================================

# --- identity / locations --------------------------------------------------
# EVIDENCE_BASE=/Volumes/IR                 # output root (external media only)
# LOG_LOOKBACK=14d                          # unified-log --last window
# TARGET_USER=jdoe                          # default: $SUDO_USER
# CASE_ID="IR-20260612-host"                # default: IR-<ts>-<hostname>

# Extra IOC indicators file (one per line; blank/# lines ignored).
# IOC_FILE=/Volumes/IR/case/iocs.txt

# --- windows / sizing (integers) -------------------------------------------
# MIN_FREE_GB=10                            # free-space warning threshold
# MAX_SAMPLE_BYTES=52428800                 # auto-capture cap (50 MiB)
# MAX_SAMPLE_BYTES=$(( 200 * 1024 * 1024 )) # ...e.g. raise to 200 MiB
# MACHO_MAX_SIZE=50M                        # find -size operand (note 'M' suffix)
# CHANGE_WINDOW_DAYS=30                      # mtime/btime bracket
# PAM_WINDOW_DAYS=90                         # PAM modification lookback
# HIDDEN_DIR_MAXDEPTH=3                       # find -maxdepth for hidden dirs
# HISTORY_TAIL_LINES=500                      # shell history tail length
# LOG_HEAD_LINES=300                          # launchctl/log truncation
# VMMAP_HEAD_LINES=100                        # vmmap & powermetrics head
# FSEVENTS_FILE_LIMIT=200                      # max fsevents gz files parsed
# IOC_HIT_LIMIT=100                            # max grep hits printed per IOC

# --- behavior toggles (1 = on, 0 = off) ------------------------------------
# DO_SNAPSHOT=1            # take + mount read-only APFS snapshot (atime-safe).
                          #   0 => reads hit LIVE fs and DO alter atimes.
# DO_DIAGNOSTICS_TAR=1    # large /var/db/diagnostics + uuidtext tarball
# DO_FSEVENTS_TAR=1       # /.fseventsd tarball (SIP may block)
# DO_POWERMETRICS=1       # live, host-mutating sampler (set 0 for forensic purity)
# DO_FULL_DISK_SCAN=1     # whole-volume time-bracket find (slow on big disks)
# DO_LSOF_ALL=1           # full 'lsof -nP' (expensive)
# DO_BUNDLE=1             # produce <CASE_ID>.tar.gz at the end

# --- phase selection (space-separated) -------------------------------------
# PHASES="0 1 2 3 4 5 6 7 8"                # all phases
# PHASES="0 1 4 8"                          # fast triage example

# --- color -----------------------------------------------------------------
# FORCE_COLOR=auto                          # auto | always | never
                                            # (env NO_COLOR also forces off)

# ============================================================================
# Collections — predefine to REPLACE defaults, or use += to APPEND to them.
# The literal token  HOME  inside KNOWN_BAD_PATHS is expanded to the target
# user's home directory at use-time.
# ============================================================================

# --- Known-bad artifact paths ----------------------------------------------
# APPEND case-specific drop paths (keeps the built-in list):
# KNOWN_BAD_PATHS+=(
#   /Users/Shared/.cache/x
#   HOME/.local/state/y
#   /tmp/.update2
# )
#
# Or REPLACE entirely (uncomment to take full control):
# KNOWN_BAD_PATHS=(
#   /tmp/helper /tmp/.helper /tmp/update
#   HOME/.fg HOME/Library/LaunchAgents/com.finder.helper.plist
# )

# --- Prune dirs for the full-disk find (skip these subtrees) ---------------
# PRUNE_DIRS=( /System /Library/Apple /private/var/folders
#              /private/var/db /usr /bin /sbin )
# PRUNE_DIRS+=( /opt/large-dataset )         # append a noisy local tree

# --- Browser-extension wallet IDs (associative array: ID => Name) ----------
# Add a newly observed wallet extension without editing the script:
# EXT_WALLETS[abcdefghijklmnopqrstuvwxyz012345]=CustomWallet
#
# Or REPLACE the whole map:
# typeset -A EXT_WALLETS=(
#   nkbihfbeogaeaoehlefnkodbefgpgknn MetaMask
#   bfnaelmomeimhlpmgjnjophhpkkoljpa Phantom
# )

# --- IOC strings (matched as FIXED strings, not regex) ---------------------
# Prefer IOC_FILE for volatile per-case indicators. To append inline:
# IOC_STRINGS+=(
#   "new-c2-domain.example"
#   "1.2.3.4"
#   "deadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
# )

# ============================================================================
# Recipe presets (uncomment ONE block as a starting point)
# ============================================================================

# --- Fast beacon-only triage -----------------------------------------------
# PHASES="0 1 4 8"
# DO_POWERMETRICS=0
# DO_FULL_DISK_SCAN=0
# DO_DIAGNOSTICS_TAR=0
# LOG_LOOKBACK=7d

# --- Forensic-pure (minimize host mutation) --------------------------------
# DO_POWERMETRICS=0          # no live sampler
# DO_SNAPSHOT=1              # keep snapshot ON: it is read-only + atime-safe
# CHANGE_WINDOW_DAYS=30

# --- Deep / large host ------------------------------------------------------
# LOG_LOOKBACK=30d
# CHANGE_WINDOW_DAYS=60
# MAX_SAMPLE_BYTES=$(( 256 * 1024 * 1024 ))
# FSEVENTS_FILE_LIMIT=1000